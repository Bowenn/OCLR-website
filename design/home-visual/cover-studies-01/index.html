<header><div><h1>封面构图 · 四种方向</h1><p>以 R05 为字形基准，缩小 S11，比较位置、倾斜和层次。</p></div><a href="../revision-05/">保留的 SVG 基准 ↗</a></header>
<main class="grid">
<figure><a href="a-diagonal.png"><img src="a-diagonal.png" alt="A 上扬斜排封面"></a><figcaption><strong>A · 上扬斜排</strong><span>倾斜的主标题，小 S11 附在 R 下方。</span></figcaption></figure>
<figure><a href="b-horizontal.png"><img src="b-horizontal.png" alt="B 横排留白封面"></a><figcaption><strong>B · 横排留白</strong><span>横向主标题，S11 缩成左上角标记。</span></figcaption></figure>

<figure><a href="d-stacked.png"><img src="d-stacked.png" alt="D 双层构图封面"></a><figcaption><strong>D · 双层构图</strong><span>OC / LR 叠成两行，S11 为次级标签。</span></figcaption></figure>
