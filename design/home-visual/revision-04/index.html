  <header>
    <div><p class="eyebrow">OCLR / SHAPE STUDY · REVISION 04</p><h1>先确认形状与横向布局</h1></div>

      <p class="geometry-note">保留参考图中六个控制点的位置与顺序：左下起点 → 左侧中间点 → 上方 → 右侧 → 中部 → 右下。两段圆弧接一段直线，末段按截图中的实际滑条端点收短。整体排版只做等比缩放。截图之外的轮廓依照圆弧连续补全。</p>
    </section>
