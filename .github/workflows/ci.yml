name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 17 * * *" # 01:30 Asia/Taipei; full acceptance
  workflow_dispatch:
    inputs:
      suite:
        description: "Full release acceptance or core verification of this exact ref"
        type: choice
        options: [full, core]
        default: full
permissions:
  contents: read
# Supersede ordinary branch runs, without cancelling nightly/manual acceptance.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.suite || 'auto' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.scope.outputs.json }}
      header_mode: ${{ steps.scope.outputs.header_mode }}
      header_appearances: ${{ steps.scope.outputs.header_appearances }}
      remote_matrix: ${{ steps.scope.outputs.remote_matrix }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        name: Select coverage (unknown changes receive full acceptance)
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.sha }}
          CI_SUITE: ${{ inputs.suite }}
        run: node scripts/ci-plan.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oclr_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: oclr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      TEST_DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL 17 backup clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/oclr.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/oclr.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/oclr-pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Verify backup client versions
        run: |
          pg_dump --version
          pg_restore --version
      - run: npm ci --include=dev
      - name: Verify ESLint peer tree
        run: npm ls eslint
      - run: npm run db:migrate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Package production build
        run: tar --exclude='.next/cache' -czf /tmp/oclr-next-build.tgz .next
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: /tmp/oclr-next-build.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each runner owns its PostgreSQL service; never increase workers on this DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oclr_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: oclr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      TEST_DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      OCLR_E2E_EVIDENCE: minimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: /tmp
      - run: tar -xzf /tmp/oclr-next-build.tgz
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:core -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  header-e2e:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each runner owns its PostgreSQL service; never increase workers on this DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oclr_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: oclr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      TEST_DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      OCLR_E2E_MATRIX: ${{ needs.plan.outputs.header_mode }}
      OCLR_HEADER_APPEARANCES: ${{ needs.plan.outputs.header_appearances }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: /tmp
      - run: tar -xzf /tmp/oclr-next-build.tgz
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e:header -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  remote-e2e:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each runner owns its PostgreSQL service; never increase workers on this DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oclr_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: oclr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      TEST_DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: /tmp
      - run: tar -xzf /tmp/oclr-next-build.tgz
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:remote:core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-e2e-results
          path: test-results/
          retention-days: 7

  remote-matrix:
    needs: [plan, verify]
    if: needs.plan.outputs.remote_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each runner owns its PostgreSQL service; never increase workers on this DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oclr_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: oclr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
      TEST_DATABASE_URL: postgresql://oclr_test:isolated_ci_fixture@127.0.0.1:5432/oclr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: /tmp
      - run: tar -xzf /tmp/oclr-next-build.tgz
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:remote -- tests/remote-e2e/full-site.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-matrix-results
          path: test-results/
          retention-days: 7

  # Stable required context. Non-expected skips and failed/cancelled jobs fail closed.
  check:
    if: always()
    needs: [plan, verify, e2e, header-e2e, remote-e2e, remote-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every job selected by the coverage plan
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.ts gate

  full-check:
    if: always() && needs.plan.outputs.full == 'true'
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certify full coverage of this exact commit
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
