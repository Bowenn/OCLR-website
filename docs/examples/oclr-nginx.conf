# Install on the EXISTING Nginx host, inside the http {} context (conf.d).
# Example values only: replace the domain, app private IP and certificate paths.
# Node runs on a DIFFERENT host. Do not use 127.0.0.1 here.
upstream oclr_app {
    server 192.0.2.20:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name oclr.example.com;
    return 308 https://oclr.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name oclr.example.com;
    ssl_certificate /etc/nginx/tls/oclr-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/oclr-private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow an 8 MiB replay plus bounded multipart overhead (team images remain 5 MB).
    # App JSON handlers retain smaller per-operation limits; image bytes/pixels are bounded server-side.
    client_max_body_size 9m;
    client_body_timeout 15s;

    location / {
        # Cache policy belongs to Next.js: hashed /_next/static files get one
        # year immutable; allowlisted mutable public assets get 5 minutes.
        # Neutralize inherited expires rules; preserve upstream Cache-Control,
        # ETag, Last-Modified, Vary and all security headers, including on 304.
        # Do not add extension-wide locations or hide/replace Cache-Control.
        expires off;
        proxy_pass http://oclr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host oclr.example.com;
        proxy_set_header X-Forwarded-Host oclr.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        # This example is the public edge; discard a client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        # Preserve streamed Next.js responses and authenticated/no-store output.
        proxy_buffering off;
        proxy_cache off;
        # off disables Nginx's shared proxy cache, NOT browser caching.
        proxy_intercept_errors off;
    }
}
