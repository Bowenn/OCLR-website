<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>S10 · 最新應用 UI 設計對照</title>
    <script src="s10.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f0f3f5;
        color: #173c59;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      header {
        padding: 24px;
        background: #fff;
        border-bottom: 1px solid #ccdae0;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
      }
      a {
        color: #006c98;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 24px;
        background: #fff;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #66889d;
        border-radius: 6px;
        font: inherit;
        color: inherit;
        background: #fff;
      }
      figure {
        margin: 24px;
      }
      figcaption {
        margin-bottom: 12px;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #ccdae0;
        background: #fff;
      }
      :focus-visible {
        outline: 3px solid #006c98;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>S10 · 最新應用 UI 設計對照</h1>
      <p>
        圖片直接來自 main <code>0d3e203</code> 的實際頁面。S10 加入 city pop 插畫與候選
        CSS；頁面元件、內容與導覽結構保持一致。
      </p>
      <p>
        <a href="s10/DESIGN.md">設計規格與重現步驟</a> ·
        <a href="s10/verification.json">截圖與檢查紀錄</a> ·
        <a href="https://github.com/OCLR-dev/OCLR-website/issues/195"
          >Issue #195</a
        >
      </p>
    </header>
    <form aria-label="預覽控制">
      <label
        >實際頁面<select name="surface">
          <option value="">S10 主頁</option>
          <option value="mappools-">S10 圖池</option>
          <option value="admin-">Admin 網站設定</option>
        </select></label
      >
      <label
        >尺寸<select name="size">
          <option value="desktop">桌面 1440px</option>
          <option value="mobile">手機 390px</option>
        </select></label
      >
      <label
        >明暗<select name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select></label
      >
      <label
        >設計<select name="version">
          <option value="">S10 候選設計</option>
          <option value="current-">最新 UI 原有風格</option>
        </select></label
      >
    </form>
    <figure>
      <figcaption aria-live="polite" id="caption">
        S10 候選設計 · S10 主頁 · 桌面 · Light
      </figcaption>
      <img
        id="preview"
        src="s10/desktop-light.webp"
        width="1440"
        height="1000"
        alt="最新 S10 實際主頁，套用候選 S10 設計"
      />
    </figure>
  </body>
</html>
