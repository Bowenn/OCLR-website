<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>S7 · 最新應用 UI 設計對照</title>
    <script src="s7.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f4f2;
        color: #171c20;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      header {
        padding: 24px;
        background: #fff;
        border-bottom: 1px solid #cdd2d0;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
      }
      a {
        color: #796000;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 24px;
        background: #fff;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #66889d;
        border-radius: 6px;
        font: inherit;
        color: inherit;
        background: #fff;
      }
      figure {
        margin: 24px;
      }
      figcaption {
        margin-bottom: 12px;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #cdd2d0;
        background: #fff;
      }
      :focus-visible {
        outline: 3px solid #796000;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>S7 · 最新應用 UI 設計對照</h1>
      <p>
        圖片來自 main <code>515be9c</code> 上的 S7 實作
        <code>182075a</code> 實際頁面，使用 S7 Graphite Arena 的 SSR
        外觀偏好與打包樣式。拉絲銀色／深鋼金屬、具倒角與內凹槽的六角金屬嵌件，配上蜂巢線稿及競技黃細線；保留完整原主視覺。
      </p>
      <p>
        <a href="s7/DESIGN.md">設計規格與重現步驟</a> ·
        <a href="s7/verification.json">截圖與檢查紀錄</a> ·
        <a href="https://github.com/OCLR-dev/OCLR-website/issues/198"
          >Issue #198</a
        >
      </p>
    </header>
    <p style="margin: 16px 24px">
      金屬嵌件局部：<a href="s7/detail-desktop-light.png">Light</a> ·
      <a href="s7/detail-desktop-dark.png">Dark</a>（實際頁面 2× 截圖）
    </p>
    <form aria-label="預覽控制">
      <label
        >實際頁面<select name="surface">
          <option value="">S7 主頁</option>
          <option value="mappools-">S7 圖池</option>
          <option value="admin-">Admin 網站設定</option>
        </select></label
      >
      <label
        >尺寸<select name="size">
          <option value="desktop">桌面 1440px</option>
          <option value="mobile">手機 390px</option>
        </select></label
      >
      <label
        >明暗<select name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select></label
      >
      <label
        >設計<select name="version">
          <option value="">S7 精修實作</option>
          <option value="current-">最新 UI 原有風格</option>
        </select></label
      >
    </form>
    <figure>
      <figcaption aria-live="polite" id="caption">
        S7 精修實作 · S7 主頁 · 桌面 · Light
      </figcaption>
      <img
        id="preview"
        src="s7/desktop-light.webp"
        width="1440"
        height="1000"
        alt="最新 S7 實際主頁，使用正式 S7 樣式"
      />
    </figure>
  </body>
</html>
