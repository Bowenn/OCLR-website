<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>osu! Cup 風格預覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800&family=Inter:wght@500;600;800&family=Quicksand:wght@500;700&family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f5f7;--ink:#16181d;--muted:#5b6270;--line:#d9dce1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--ink:#f3f4f7;--muted:#a3a9b6;--line:#33373e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--ink:#f3f4f7;--muted:#a3a9b6;--line:#33373e;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans TC",system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1{font-size:clamp(28px,5vw,44px);margin:48px 0 8px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 30px;max-width:34em}
.row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;padding:40px 0;border-top:1px solid var(--line)}
.row h2{margin:0;font-size:24px;line-height:1.3}.row h2 small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.row p{margin:10px 0;font-size:15px}.row p b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.mk{overflow:hidden;font-size:14px;line-height:1.5;max-width:100%}
.mk .nv{display:flex;gap:16px;align-items:center;padding:12px 18px;overflow:hidden;white-space:nowrap}
.mk .nv b{margin-right:auto}
.mk .bd{padding:18px;display:grid;gap:18px}
.mk .se{padding:18px}
.mk .se h4{margin:6px 0 2px;font-size:30px;line-height:1.1}
.mk .se p{margin:0}
.mk .bar{height:12px;margin:12px 0 6px}.mk .bar i{display:block;height:100%;width:64%}
.mk .bt{display:inline-block;margin-top:10px;padding:8px 20px;font-weight:700}
.mk .tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.mk .tb span{padding:3px 14px}
.mk .mp{display:flex}.mk .mp em{font-style:normal;padding:0 16px;display:grid;place-items:center;font-weight:800;flex:none}
.mk .mp div{padding:10px 14px}.mk .mp h5{margin:0;font-size:16px}
.mk .st{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:4px}.mk .st u{text-decoration:none}

.A{background:#0e1116;color:#e9edf2;font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-size:16px}
.A .nv{border-bottom:3px solid #ff3d8b;background:#12161d;text-transform:uppercase;letter-spacing:.06em}.A .nv .on{color:#ff3d8b}
.A .se{background:#171c25;border-left:6px solid #ff3d8b;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.A .tag{display:inline-block;background:#ff3d8b;color:#0e1116;padding:1px 14px;font-weight:600;transform:skewX(-14deg)}
.A h4{font-size:44px!important;font-weight:800;font-style:italic;text-transform:uppercase}
.A .bar{background:repeating-linear-gradient(90deg,#2a313d 0 10px,transparent 10px 13px)}
.A .bar i{background:repeating-linear-gradient(90deg,#19e3ff 0 10px,transparent 10px 13px)}
.A .bt{background:#ff3d8b;color:#0e1116;transform:skewX(-14deg);text-transform:uppercase}
.A .tb span{background:#232a36;transform:skewX(-14deg)}.A .tb .on{background:#19e3ff;color:#0e1116}
.A .mp{background:#171c25}.A .mp em{background:#19e3ff;color:#0e1116;font-size:22px;padding-right:28px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.A .st u{color:#19e3ff}

.B{background:#fff;color:#111;font-family:Inter,"Noto Sans TC",sans-serif;border:1px solid #111}
.B .nv{border-bottom:1px solid #111}.B .nv .on{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.B .se{border-bottom:1px solid #111;padding:22px 18px}
.B h4{font-size:76px!important;letter-spacing:-.05em;font-weight:800;line-height:.95!important;margin:8px 0 14px!important}
.B .tag{font-weight:600;color:#ef3b2d}
.B .bar{height:4px;background:#ddd}.B .bar i{background:#111}
.B .bt{background:#ef3b2d;color:#fff}
.B .tb{gap:14px}.B .tb span{padding:3px 0;border-bottom:2px solid transparent}.B .tb .on{border-color:#111;font-weight:800}
.B .mp{border-top:1px solid #111;border-bottom:1px solid #111}.B .mp em{color:#ef3b2d;padding-left:0;font-size:18px}.B .st u{color:#555}

.C{background:#fff1f6;color:#4a2c3a;font-family:Quicksand,"Noto Sans TC",sans-serif;border-radius:28px;font-size:15px}
.C .nv .on{background:#ffd3e4;border-radius:99px;padding:2px 14px;margin:-2px}
.C .se{background:#fff;border-radius:24px;box-shadow:0 12px 30px rgba(255,79,154,.18)}
.C .tag{display:inline-block;background:#ffe3a8;color:#7a5200;border-radius:99px;padding:1px 14px;font-weight:700}
.C h4{font-weight:700}
.C .bar{background:#ffe0ec;border-radius:99px}.C .bar i{background:linear-gradient(90deg,#ff9ec4,#ffb98a);border-radius:99px}
.C .bt{background:#ff7aaf;color:#fff;border-radius:99px;box-shadow:0 8px 18px rgba(255,79,154,.35)}
.C .tb span{background:#fff;border-radius:99px;box-shadow:0 3px 10px rgba(255,79,154,.14)}.C .tb .on{background:#ff7aaf;color:#fff}
.C .mp{background:#fff;border-radius:20px;box-shadow:0 8px 22px rgba(255,79,154,.14)}
.C .mp em{background:#cfeaff;color:#2c5a85;margin:10px;border-radius:14px;padding:0 12px}.C .st u{background:#fff0f6;border-radius:99px;padding:0 10px}

.D{background:#050505;color:#fff;font-family:"Press Start 2P","Noto Sans TC",monospace;font-size:10px;line-height:1.9;border:4px solid #ffe600;position:relative}
.D::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)}
.D .nv{border-bottom:4px solid #ffe600}.D .nv b{color:#ffe600}.D .nv .on{color:#ff2e97}
.D .se{border:4px solid #00e5ff;box-shadow:5px 5px 0 #ff2e97}
.D h4{font-size:20px!important;color:#ffe600;line-height:1.5!important}.D .tag{color:#ff2e97}
.D .bar{border:3px solid #fff;height:18px}.D .bar i{background:repeating-linear-gradient(90deg,#00e5ff 0 8px,transparent 8px 10px)}
.D .bt{background:#ffe600;color:#000;box-shadow:4px 4px 0 #ff2e97}
.D .tb span{border:3px solid #fff;padding:1px 8px}.D .tb .on{background:#ff2e97;border-color:#ff2e97}
.D .mp{border:4px solid #fff}.D .mp em{background:#00e5ff;color:#000}.D .st u{color:#ffe600}
@media(max-width:760px){.row{grid-template-columns:1fr;gap:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>四種風格預覽</h1>
<p class="lead">每個預覽都放同一份內容：導覽列、賽季卡、圖池分頁和圖卡，方便直接比較。</p>
<div id="g"></div>
</div>
<script>
const mock=c=>`<div class="mk ${c}"><div class="nv"><b>osu! Cup</b><span>首頁</span><span class="on">賽季 ▾</span><span>Staff</span></div><div class="bd"><div class="se"><span class="tag">報名中</span><h4>Season 3</h4><p>2026/11/21 到 12/20</p><div class="bar"><i></i></div><small>已報名 41 / 64</small><br><span class="bt">用 osu! 帳號報名</span></div><div><div class="tb"><span>NM</span><span class="on">HD</span><span>HR</span><span>DT</span></div><div class="mp"><em>HD2</em><div><h5>Map Title 2</h5><small>Artist Name</small><div class="st"><u>★ 5.10</u><u>BPM 170</u><u>2:22</u></div></div></div></div></div></div>`;
const L=[
['A','電競轉播風','Esports Broadcast','深色底、斜切平行四邊形、截角卡片、分段式進度條。','適合：想和直播畫面、圖池圖卡統一成同一套視覺。','注意：整站深色，賽程表長時間閱讀比較累。'],
['B','瑞士極簡風','Swiss / Editorial','白底、細線、超大數字，整頁只有一個強調色。','適合：資料多、重視可讀性，歷屆統計與選手紀錄會很清楚。','注意：沒有遊戲感，排版要精準，沒有裝飾可以遮掩。'],
['C','柔和可愛風','Soft / Kawaii','粉彩色、大圓角、柔和的擴散陰影。','適合：社群感強、想讓新手選手覺得親切。','注意：資料密集的表格容易顯得軟，文字對比要小心。'],
['D','街機復古風','Retro Arcade','黑底、像素字體、掃描線、霓虹色與硬陰影。','適合：節奏遊戲的街機文化，做成活動感很強的主題賽季。','注意：像素字體不支援中文，中文要混搭別的字體，只適合標題。']];
document.getElementById('g').innerHTML=L.map(x=>`<div class="row"><div><h2>${x[1]}<small>${x[2]}</small></h2><p>${x[3]}</p><p>${x[4]}</p><p>${x[5]}</p></div>${mock(x[0])}</div>`).join('');
</script>
</body>
</html>
